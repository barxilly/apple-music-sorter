services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    ports:
      # Host port 8080 was already taken, and there's no reason to expose a
      # search proxy beyond localhost - keep it bound to 127.0.0.1.
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
